<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .site{
        width:600px;
        height:600px;
        background-color: rgb(70, 193, 18);
      }
      .linha1{
        flex-direction:row;
      }
      .linha2{
        flex-direction:row;
      }
      .linha3{
        flex-direction:row;
      }
      .linha4{
        flex-direction:row;
      }
      .linha5{
        flex-direction:row;
      }
      .linha6{
        flex-direction:row;
      }
      .linha7{
        flex-direction:row;
      }
      .linha8{
        flex-direction:row;
      }
      .linha9{
        flex-direction:row;
      }
    </style>
</head>
<body>
    <div class="site">
        <fieldset>
          <legend>DADOS PESSOAIS</legend>
        <div class="linha1">
          <label>Nome Completo:<input type="text"></label>
          <label>Sexo:
            <select>
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Outros</option>
            </select></label>
           
        </div>
        <div class="linha2">
        <label>Data de Nascimento:<input type="date"></label>
        <label>CPF:<input type="text"></label>
        <label>RG:<input type="text"></label>
        <label>Nacionalidade:<input type="text"></label>
        </div>
        <div class="linha3">
        <label>Email:<input type="email"></label>
        <label>Telefone Celular:<input type="number"></label>
        <label>Telefone Residencial:<input type="number"></label>
        </div>
        </fieldset>
        <fieldset>
          <legend>DADOS DE ENDEREÇO</legend>
        <div class="linha4">
        <label>CEP:<input type="number"></label>
        <label>Logradouro:<input type="text"></label>
        <label>Numero:<input type="number"></label>
        <label>Complemento:<input type="text"></label>
        </div>
        <div class="linha5">
        Bairro:<input type="text">
        Cidade:<input type="text">
        Estado:<select>
            <option>SP</option>
          </select>
        </div>
        </fieldset>
        <fieldset>
          <legend>DADOS ACADEMICOS</legend>
        <div class="linha6">
        Curso:<input type="text">
        Matricula (RA):<input type="number">
        Ano/Semestre Ingresso:<input type="text">
        </div>
        <div class="linha7">
        Modalidade:<select>
            <option>Presencial</option>
          </select>
        Turno<select>
            <option>Manha</option>
          </select>
        Escolaridade Anterior<input type="text">
        </div>
        </fieldset>
        <fieldset>
          <legend>DADOS DO RESPONSAVEL</legend>
        <div class="linha8">
        Nome do Responsavel:<input type="text">
        CPF do responsavel<input type="text">
        </div>
        <div class="linha9">
        Observaçoes:<textarea></textarea>
        </div>
        </fieldset>
    </div>
</body>
</html>
