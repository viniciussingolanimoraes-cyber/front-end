<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .campo{
            background-color: green;
            border:5px solid black;
        }
        .botao{
            width: 5%;
            height: 3%;
            background-color: gray;
            border:1.5px solid khaki;
        }
        .botao2{
            width: 5%;
            height: 3%;
            background-color: blueviolet;
            border:1.5px solid hotpink;
        }
        .botao3{
            width: 5%;
            height: 3%;
            background-color: red;
            border:1.5px solid khaki;
        }
        .botao4{
            width: 5%;
            height: 3%;
            background-color:royalblue ;
            border:1.5px solid brown;
        }
    </style>
    </style>
    </style>
    </style>
</head>
<body>
    <fieldset>
        <legend> CALCULADORA DO 2°A</legend>
        <input type="text" id="campo" class="campo"><br><br>
        <button class="botao">1</button>
        <button class="botao">2</button>
        <button class="botao">3</button>
        <button class="botao2">x</button>
        <button class="botao2">^</button>
        <br>
        <button class="botao">4</button>
        <button class="botao">5</button>
        <button class="botao">6</button>
        <button class="botao2">/</button>
        <button class="botao2">(</button>
        <br>
        <button class="botao">7</button>
        <button class="botao">8</button>
        <button class="botao">9</button>
        <button class="botao2">+</button>
        <button class="botao2">)</button>
        <br>
        <button class="botao2">*</button>
        <button class="botao">0</button>
        <button class="botao2">#</button>
        <button class="botao2">-</button>
        <button class="botao2">%</button>
        <br>
        <button class="botao3">C</button>
        <button class="botao4">=</button>
    </fieldset>
</body>
</html>
